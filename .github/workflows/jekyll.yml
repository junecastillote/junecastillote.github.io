name: Deploy Chirpy Jekyll site to GitHub Pages

on:
  push:
    branches: ["chirpy-v3"] # default branch for production
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout repository
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # optional, in case assets use git submodules

      # -----------------------------
      # Node.js setup for frontend assets
      # -----------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      # -----------------------------
      # Ruby setup for Jekyll
      # -----------------------------
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          cache-version: 0

      # -----------------------------
      # Configure GitHub Pages
      # -----------------------------
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # -----------------------------
      # Build Jekyll site
      # -----------------------------
      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # -----------------------------
      # Ensure .nojekyll exists
      # -----------------------------
      - name: Create .nojekyll
        run: touch _site/.nojekyll

      # -----------------------------
      # Upload site for deployment
      # -----------------------------
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
